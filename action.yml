name: "Workflow Telemetry"
description: "Collect CPU, memory, disk, network, step, and process telemetry of a job; show it in the job summary and optionally send it to PostHog"
author: "Serkan Özal <serkan@thundra.io>, 0xPlaygrounds"
inputs:
  github_token:
    description: "GitHub API token. The job needs `actions: read` to read its own steps."
    default: ${{ github.token }}
    required: false
  metric_frequency:
    description: "Seconds between two resource samples. Defaults to '5'."
    default: "5"
    required: false
  posthog_api_key:
    description: "PostHog project API key. When set, one `ci_job_resources` event per job is sent to PostHog. When empty, the event is printed in the log."
    default: ""
    required: false
  posthog_host:
    description: "PostHog ingestion host. Defaults to 'https://us.i.posthog.com'."
    default: "https://us.i.posthog.com"
    required: false
  proc_trace_enable:
    description: "Set to `true` to trace every process of the job with eBPF. Needs passwordless sudo and a kernel with BTF (Ubuntu 20.04 and later). Defaults to 'false'."
    default: "false"
    required: false
  proc_trace_min_duration:
    description: "Minimum process duration in milliseconds to be traced. Defaults to '-1', which traces all processes."
    default: "-1"
    required: false
  proc_trace_sys_enable:
    description: "Set to `true` to also trace common system processes ('cat', 'sed', ...). Defaults to 'false'."
    default: "false"
    required: false
  proc_trace_chart_show:
    description: "Show traced processes in a chart. Defaults to 'true'."
    default: "true"
    required: false
  proc_trace_chart_max_count:
    description: "Maximum number of processes in the chart. Defaults to '100'."
    default: "100"
    required: false
  proc_trace_table_show:
    description: "Show all traced processes with their arguments in a table. Arguments can contain sensitive values. Defaults to 'false'."
    default: "false"
    required: false
  comment_on_pr:
    description: "Set to `true` to also post the report as a pull request comment (needs `pull-requests: write`). Defaults to 'false'."
    default: "false"
    required: false
  job_summary:
    description: "Set to `false` to not write the report to the job summary. Defaults to 'true'."
    default: "true"
    required: false
  job_key:
    description: "Key that identifies this job across runner labels and calling workflows, so its runs can be compared. Defaults to the job's id in its workflow file (`github.job`). Set it when a matrix runs one job id with different work, for example `warm-clippy`."
    required: false

runs:
  using: "node24"
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: always()
branding:
  icon: "activity"
  color: "yellow"
