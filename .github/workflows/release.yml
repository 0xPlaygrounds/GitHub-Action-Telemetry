name: release-workflow-telemetry

# Tags the current master as vX.Y.Z, moves the major tag (for example v3) to it, and creates a
# GitHub release with generated notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 3.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 3.0.1"; exit 1; }
          [[ $(jq -r .version package.json) == "$VERSION" ]] || { echo "::error::package.json version is not $VERSION"; exit 1; }
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git tag -f "v${VERSION%%.*}"
          git push origin "v$VERSION"
          git push -f origin "v${VERSION%%.*}"
          gh release create "v$VERSION" --generate-notes --verify-tag
